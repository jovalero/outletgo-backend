# Spring Datasource Config (Supabase PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Config
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Security & Supabase JWT Configuration
jwt.secret=${SUPABASE_JWT_SECRET}

# MercadoPago Integration Settings
mercadopago.access-token=${MP_ACCESS_TOKEN}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Multipart / File Upload — Incrementado a 50MB para banners en alta calidad
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
server.tomcat.max-http-form-post-size=55MB

# Server Port Configuration (Render dynamic PORT support)
server.port=${PORT:8080}

# Jackson — Configuracion de fechas y tolerancia de campos desconocidos
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
